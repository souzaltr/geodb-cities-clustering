version: "3.9"

services:
  backend:
    build: ./server
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
    environment:
      - VITE_API_KEY=${VITE_API_KEY}  
    restart: no

  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend
    restart: no
