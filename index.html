<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>GeoDB Paradigmas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body class="bg-light">

<div class="container py-4">

  <h1 class="mb-4 text-center">GeoDB Cities</h1>

  <div class="row g-4">

    <div class="col-md-7">
      <div class="card shadow-sm h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Cidades disponíveis</strong>
          <div>
            <button id="select-page" class="btn btn-sm btn-outline-primary">Selecionar toda a página</button>
            <button id="clear-page" class="btn btn-sm btn-outline-secondary">Desselecionar toda a página</button>
          </div>
        </div>
        <div class="card-body" id="cities-list"></div>
        <div class="card-footer text-center" id="pagination"></div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card shadow-sm h-100">
        <div class="card-header d-flex justify-content-between">
          <strong>Cidades selecionadas</strong>
          <span id="selected-count">0</span>
        </div>
        <div class="card-body" id="selected-list"></div>
        <div class="card-footer">
          <button id="clear-all" class="btn btn-sm btn-danger w-100">Remover todas</button>
        </div>
      </div>
    </div>

  </div>

  <hr class="my-4">

  <div class="card p-3 shadow-sm mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Valor de K para o K-MEANS</label>
        <input type="number" id="kValue" class="form-control" min="2" max="10" value="3">
      </div>
      <div class="col-md-3">
        <button id="btn-process" class="btn btn-success">Processar cidades</button>
      </div>
    </div>
  </div>

  <div class="card p-3 shadow-sm mb-4">
    <h4>Clusters Gerados</h4>
    <div id="clusters" class="row mt-3"></div>
  </div>

  <div class="card p-3 shadow-sm">
    <h4>Tamanho dos Clusters</h4>
    <canvas id="clusterChart"></canvas>
  </div>

</div>


<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="/src/main.js"></script>
</body>
</html>
